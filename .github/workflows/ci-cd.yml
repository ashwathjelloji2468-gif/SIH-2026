name: SENTRIQ CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ==========================================
  # Frontend Test & Production Build
  # ==========================================
  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Validate TypeScript & Build Bundle
        run: npm run build

  # ==========================================
  # Backend Lint & Unit Verification
  # ==========================================
  backend-ci:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v

  # ==========================================
  # Automated Deployment Trigger (Optional Hooks)
  # ==========================================
  deploy:
    name: Trigger Deployments
    needs: [frontend-ci, backend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Trigger Render Deploy Hook (if secret configured)
      - name: Trigger Render Deploy Hook
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render webhook..."
          curl -s -X POST "$RENDER_DEPLOY_HOOK"
          echo "Render deploy triggered successfully."

      # Notify Deployment Status
      - name: Deployment Ready
        run: |
          echo "CI/CD checks passed for commit ${{ github.sha }}."
          echo "Vercel auto-deploys frontend from GitHub integration."
          echo "Render auto-deploys backend from GitHub integration / Blueprint."
